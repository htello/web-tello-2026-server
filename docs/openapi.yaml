openapi: 3.0.3
info:
  title: API Portfolio Antonio Tello
  description: API REST para la gestión del portfolio artístico. Permite la administración de colecciones, pinturas, exposiciones, diseño, ilustraciones, biografía y contacto.
  version: 1.0.0
  contact:
    name: Soporte API
  license:
    name: MIT

servers:
  - url: http://localhost:3000/api/v1
    description: Servidor local de desarrollo
  - url: https://api.portfolio.com/api/v1
    description: Servidor de producción

tags:
  - name: Auth
    description: Autenticación y registro
  - name: Users
    description: Gestión de usuarios (Admin)
  - name: Collections
    description: Colecciones de pintura
  - name: Paintings
    description: Pinturas
  - name: Exhibitions
    description: Exposiciones
  - name: Design
    description: Proyectos de diseño
  - name: Illustrations
    description: Ilustraciones
  - name: Biography
    description: Biografía del artista
  - name: Contact
    description: Formulario de contacto
  - name: Upload
    description: Subida de archivos
  - name: Health
    description: Estado del sistema

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido en POST /auth/login

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - RATE_LIMITED
            - INTERNAL_ERROR
      required:
        - error
        - code
      example:
        error: "Credenciales inválidas"
        code: "UNAUTHORIZED"

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        pages:
          type: integer

    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            token:
              type: string
            user:
              $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [ADMIN, USER]
        createdAt:
          type: string
          format: date-time

    UserUpdateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [ADMIN, USER]

    PasswordResetRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          minLength: 8

    Collection:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        coverImage:
          type: string
          format: uri
        position:
          type: integer
        isPublished:
          type: boolean
        paintingsCount:
          type: integer

    CollectionDetail:
      allOf:
        - $ref: '#/components/schemas/Collection'
        - type: object
          properties:
            paintings:
              type: array
              items:
                $ref: '#/components/schemas/PaintingSummary'

    CollectionRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        description:
          type: string
        coverImage:
          type: string
          format: uri
        position:
          type: integer
        isPublished:
          type: boolean

    ReorderRequest:
      type: object
      required:
        - orderedIds
      properties:
        orderedIds:
          type: array
          items:
            type: integer

    PaintingSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        imageUrl:
          type: string
          format: uri
        dimensions:
          type: string
        technique:
          type: string
        year:
          type: integer
        isFeatured:
          type: boolean

    PaintingDetail:
      allOf:
        - $ref: '#/components/schemas/PaintingSummary'
        - type: object
          properties:
            collection:
              type: object
              properties:
                id:
                  type: integer
                title:
                  type: string

    PaintingRequest:
      type: object
      required:
        - title
        - collectionId
      properties:
        title:
          type: string
        dimensions:
          type: string
        technique:
          type: string
        year:
          type: integer
        collectionId:
          type: integer
        isFeatured:
          type: boolean
        isPublished:
          type: boolean
        image:
          type: string
          format: binary

    PaintingReorderRequest:
      type: object
      required:
        - orderedIds
        - collectionId
      properties:
        orderedIds:
          type: array
          items:
            type: integer
        collectionId:
          type: integer

    Exhibition:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        date:
          type: string
          format: date
        location:
          type: string
        description:
          type: string
        position:
          type: integer

    ExhibitionRequest:
      type: object
      required:
        - title
        - date
      properties:
        title:
          type: string
        date:
          type: string
          format: date
        location:
          type: string
        description:
          type: string
        position:
          type: integer

    DesignProject:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
          format: uri
        category:
          type: string
        subcategory:
          type: string
          enum:
            - imagen-corporativa
            - packaging-expositores
            - carteleria
            - editorial

    DesignRequest:
      type: object
      required:
        - title
        - category
        - subcategory
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        subcategory:
          type: string
          enum:
            - imagen-corporativa
            - packaging-expositores
            - carteleria
            - editorial
        image:
          type: string
          format: binary

    Illustration:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        imageUrl:
          type: string
          format: uri
        description:
          type: string

    IllustrationRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        description:
          type: string
        image:
          type: string
          format: binary

    Biography:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        imageUrl:
          type: string
          format: uri
        updatedAt:
          type: string
          format: date-time

    BiographyRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
        image:
          type: string
          format: binary

    ContactRequest:
      type: object
      required:
        - name
        - email
        - subject
        - message
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        subject:
          type: string
        message:
          type: string

    ContactResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string
              example: "Mensaje enviado correctamente"

    UploadResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            url:
              type: string
              format: uri
            thumbnail:
              type: string
              format: uri
            width:
              type: integer
            height:
              type: integer
            format:
              type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time

    MessageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar nuevo usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/users:
    get:
      tags: [Users]
      summary: Listar todos los usuarios
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sin permisos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/users/{id}:
    get:
      tags: [Users]
      summary: Obtener detalle de usuario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sin permisos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Users]
      summary: Editar usuario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sin permisos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Users]
      summary: Eliminar usuario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Usuario eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sin permisos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/users/{id}/password:
    put:
      tags: [Users]
      summary: Resetear contraseña de usuario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sin permisos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /collections:
    get:
      tags: [Collections]
      summary: Listar colecciones publicadas
      security: []
      responses:
        '200':
          description: Lista de colecciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Collection'

  /collections/{id}:
    get:
      tags: [Collections]
      summary: Detalle de colección con sus pinturas
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalle de colección
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CollectionDetail'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/collections:
    post:
      tags: [Collections]
      summary: Crear colección
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionRequest'
      responses:
        '201':
          description: Colección creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Collection'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/collections/{id}:
    put:
      tags: [Collections]
      summary: Editar colección
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionRequest'
      responses:
        '200':
          description: Colección actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Collection'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Collections]
      summary: Eliminar colección
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Colección eliminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/collections/reorder:
    put:
      tags: [Collections]
      summary: Reordenar colecciones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderRequest'
      responses:
        '200':
          description: Colecciones reordenadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /paintings/featured:
    get:
      tags: [Paintings]
      summary: Obras destacadas (portada)
      security: []
      responses:
        '200':
          description: Lista de pinturas destacadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaintingSummary'

  /paintings/{id}:
    get:
      tags: [Paintings]
      summary: Ficha detallada de pintura
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalle de pintura
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PaintingDetail'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/paintings:
    post:
      tags: [Paintings]
      summary: Crear pintura
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaintingRequest'
      responses:
        '201':
          description: Pintura creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PaintingDetail'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/paintings/{id}:
    put:
      tags: [Paintings]
      summary: Editar pintura
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaintingRequest'
      responses:
        '200':
          description: Pintura actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PaintingDetail'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Paintings]
      summary: Eliminar pintura
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pintura eliminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/paintings/{id}/feature:
    put:
      tags: [Paintings]
      summary: Marcar/desmarcar como destacada
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Estado de destacado actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      isFeatured:
                        type: boolean
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/paintings/{id}/publish:
    put:
      tags: [Paintings]
      summary: Publicar/ocultar pintura
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Estado de publicación actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      isPublished:
                        type: boolean
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/paintings/reorder:
    put:
      tags: [Paintings]
      summary: Reordenar pinturas dentro de colección
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaintingReorderRequest'
      responses:
        '200':
          description: Pinturas reordenadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /exhibitions:
    get:
      tags: [Exhibitions]
      summary: Listar exposiciones ordenadas por position
      security: []
      responses:
        '200':
          description: Lista de exposiciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Exhibition'

  /admin/exhibitions:
    post:
      tags: [Exhibitions]
      summary: Crear exposición
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExhibitionRequest'
      responses:
        '201':
          description: Exposición creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Exhibition'
        '400':
          description: Solicitud inválida
          content:
